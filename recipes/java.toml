name = "Java"
category = "language"
description = "Eclipse Temurin JDK with Maven and Gradle"
icon = "openjdk.svg"
icon_color = "#000000"
os = ["debian", "ubuntu"]
versions = ["25", "21", "17"]
install_allow = ["@packages", "api.adoptium.net", "github.com", "*.githubusercontent.com", "repo.maven.apache.org", "services.gradle.org", "downloads.gradle.org"]
# Gradle's wrapper fetches Gradle itself from GitHub: services.gradle.org sends it there.
allow = ["repo.maven.apache.org", "repo1.maven.org", "plugins.gradle.org", "services.gradle.org", "downloads.gradle.org", "plugins-artifacts.gradle.org", "github.com", "release-assets.githubusercontent.com"]
install = '''
# JDK from Adoptium (the chosen LTS release), Maven from Maven Central and Gradle from gradle.org.
case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=aarch64 ;; *) echo "unsupported CPU" >&2; exit 1 ;; esac
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl unzip
# Downloads go to the disk and are removed again, also when something fails.
work=$(mktemp -d -p /var/tmp)
trap 'rm -rf "$work"' EXIT
cd "$work"
curl -fsSLo jdk.tar.gz "https://api.adoptium.net/v3/binary/latest/$BOXQUELL_VERSION/ga/linux/$arch/jdk/hotspot/normal/eclipse"
sudo rm -rf /usr/local/jdk
sudo mkdir /usr/local/jdk
sudo tar -xzf jdk.tar.gz -C /usr/local/jdk --strip-components=1 --no-same-owner
printf 'export JAVA_HOME=/usr/local/jdk\n' | sudo tee /etc/profile.d/java.sh >/dev/null
for tool in java javac jar jshell keytool; do sudo ln -sf "/usr/local/jdk/bin/$tool" /usr/local/bin/; done
# The JDK has its own list of trusted certificates. Without the sandbox's certificate in it, Java refuses
# every connection Boxquell looks into: hosts that get a key, and hosts that are open for reading only.
if [ -f /run/boxquell/ca.crt ]; then
  sudo /usr/local/jdk/bin/keytool -importcert -noprompt -cacerts -storepass changeit -alias boxquell -file /run/boxquell/ca.crt >/dev/null
fi
# The newest stable Maven 3.
mvn_base=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven
mvn=$(curl -fsSL "$mvn_base/maven-metadata.xml" | sed -n 's|.*<version>\(3\.[0-9.]*\)</version>.*|\1|p' | sort -V | tail -n1)
[ -n "$mvn" ] || { echo "no Maven release found" >&2; exit 1; }
curl -fsSLo maven.tar.gz "$mvn_base/$mvn/apache-maven-$mvn-bin.tar.gz"
curl -fsSL "$mvn_base/$mvn/apache-maven-$mvn-bin.tar.gz.sha512" | sed 's/$/  maven.tar.gz/' | sha512sum -c -
sudo rm -rf /usr/local/maven
sudo mkdir /usr/local/maven
sudo tar -xzf maven.tar.gz -C /usr/local/maven --strip-components=1 --no-same-owner
sudo ln -sf /usr/local/maven/bin/mvn /usr/local/bin/mvn
# The current Gradle release.
gradle_url=$(curl -fsSL https://services.gradle.org/versions/current | sed -n 's|.*"downloadUrl" *: *"\([^"]*\)".*|\1|p')
curl -fsSLo gradle.zip "$gradle_url"
curl -fsSL "$gradle_url.sha256" | sed 's/$/  gradle.zip/' | sha256sum -c -
unzip -q gradle.zip
sudo rm -rf /usr/local/gradle
sudo mv gradle-* /usr/local/gradle
sudo ln -sf /usr/local/gradle/bin/gradle /usr/local/bin/gradle
java -version 2>&1 | head -n1
mvn --version | head -n1
gradle --version | grep '^Gradle'
'''

# Settings on a sandbox's Config tab; each is an environment variable.
[[config]]
env = "JAVA_TOOL_OPTIONS"
label = "JVM options"
help = "Options picked up by every JVM that starts."
options = ["-Xmx2g"]
placeholder = "none"

[[config]]
env = "MAVEN_OPTS"
label = "Maven JVM options"
help = "Options for the JVM that runs Maven."
options = ["-Xmx1g"]
placeholder = "none"

[[config]]
env = "MAVEN_ARGS"
label = "Maven arguments"
help = "Arguments added to every mvn call."
options = ["--batch-mode"]
placeholder = "none"

[[config]]
env = "GRADLE_OPTS"
label = "Gradle JVM options"
help = "Options for the JVM that runs the Gradle client."
options = ["-Xmx1g"]
placeholder = "none"

[[config]]
env = "GRADLE_USER_HOME"
label = "Gradle home"
help = "Where Gradle keeps its caches and settings."
placeholder = "~/.gradle"
