name = "Dart"
category = "language"
description = "Dart SDK with the pub package manager"
icon = "dart.svg"
icon_color = "#0175C2"
os = ["debian", "ubuntu"]
install_allow = ["@packages", "storage.googleapis.com"]
allow = ["pub.dev", "storage.googleapis.com"]
install = '''
# The current stable SDK from Dart's own archive, checked against its checksum file.
case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "unsupported CPU" >&2; exit 1 ;; esac
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl unzip
base=https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk
file="dartsdk-linux-$arch-release.zip"
# Downloads go to the disk and are removed again, also when something fails.
work=$(mktemp -d -p /var/tmp)
trap 'rm -rf "$work"' EXIT
cd "$work"
curl -fsSLo "$file" "$base/$file"
curl -fsSL "$base/$file.sha256sum" | sha256sum -c -
unzip -q "$file"
sudo rm -rf /usr/local/dart-sdk
sudo mv dart-sdk /usr/local/dart-sdk
sudo chmod -R a+rX /usr/local/dart-sdk
sudo ln -sf /usr/local/dart-sdk/bin/dart /usr/local/bin/dart
dart --version
'''
uninstall = '''
sudo rm -rf /usr/local/dart-sdk /usr/local/bin/dart
'''

# Settings on a sandbox's Config tab; each is an environment variable.
[[config]]
env = "PUB_HOSTED_URL"
label = "Package registry"
help = "Where pub downloads packages from."
options = ["https://pub.dev"]
placeholder = "https://pub.dev"

[[config]]
env = "PUB_CACHE"
label = "Package cache"
help = "Where pub keeps downloaded packages."
placeholder = "~/.pub-cache"
