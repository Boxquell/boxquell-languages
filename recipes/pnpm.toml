name = "pnpm"
category = "language"
description = "pnpm, the fast disk-efficient package manager for Node.js (installs Node.js)"
icon = "pnpm.svg"
icon_color = "#F69220"
os = ["debian", "ubuntu"]
requires = ["node"]
install_allow = ["registry.npmjs.org"]
allow = ["registry.npmjs.org"]
install = '''
# Installed with npm into /usr/local so every user and session finds it.
sudo npm install -g pnpm@latest
pnpm --version
'''
