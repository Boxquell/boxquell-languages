name = ".NET"
category = "language"
description = ".NET SDK with the `dotnet` command, in /usr/local/dotnet"
icon = "dotnet.svg"
icon_color = "#512BD4"
os = ["debian", "ubuntu"]
versions = ["10.0", "11.0"]
install_allow = ["@packages", "dot.net", "builds.dotnet.microsoft.com", "ci.dot.net", "dotnetcli.azureedge.net", "dotnetcli.blob.core.windows.net"]
allow = ["api.nuget.org", "*.nuget.org"]
install = '''
# Microsoft's official install script, which picks the newest SDK of the chosen channel.
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl libicu-dev
cd "$(mktemp -d)"
curl -fsSLo dotnet-install.sh https://dot.net/v1/dotnet-install.sh
sudo bash dotnet-install.sh --channel "$BOXQUELL_VERSION" --install-dir /usr/local/dotnet
sudo ln -sf /usr/local/dotnet/dotnet /usr/local/bin/dotnet
dotnet --version
'''

[env]
DOTNET_ROOT = "/usr/local/dotnet"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

# Settings on a sandbox's Config tab; each is an environment variable.
[[config]]
env = "NUGET_PACKAGES"
label = "NuGet package folder"
help = "Where NuGet keeps downloaded packages."
placeholder = "~/.nuget/packages"

[[config]]
env = "DOTNET_CLI_UI_LANGUAGE"
label = "Tool language"
help = "Language of .NET CLI messages."
options = ["en"]
placeholder = "system language"

[[config]]
env = "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT"
label = "Invariant globalization"
help = "Run without ICU culture data."
kind = "switch"
on = "1"

[[config]]
env = "ASPNETCORE_ENVIRONMENT"
label = "ASP.NET environment"
help = "Which environment an ASP.NET Core app runs as."
kind = "choice"
options = ["Development", "Staging", "Production"]
placeholder = "Production"
