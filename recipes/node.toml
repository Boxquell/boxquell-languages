name = "Node.js"
category = "language"
description = "Node.js with npm, installed to /usr/local"
icon = "nodedotjs.svg"
icon_color = "#5FA04E"
os = ["debian", "ubuntu"]
versions = ["24", "26", "22", "20"]
install_allow = ["nodejs.org"]
allow = ["registry.npmjs.org"]
install = '''
case "$(uname -m)" in x86_64) arch=x64 ;; aarch64) arch=arm64 ;; *) echo "unsupported CPU" >&2; exit 1 ;; esac
base=https://nodejs.org/dist/latest-v$BOXQUELL_VERSION.x
# Downloads go to the disk and are removed again, also when something fails.
work=$(mktemp -d -p /var/tmp)
trap 'rm -rf "$work"' EXIT
cd "$work"
curl -fsSL "$base/SHASUMS256.txt" | grep "linux-$arch.tar.gz\$" > sums
file=$(cut -d' ' -f3 sums)
curl -fsSLO "$base/$file"
sha256sum -c sums
sudo tar -xzf "$file" -C /usr/local --strip-components=1 --no-same-owner
node --version
'''

# Settings on a sandbox's Config tab; each is an environment variable.
[[config]]
env = "NODE_OPTIONS"
label = "Node options"
help = "Command line options passed to every Node process."
options = ["--max-old-space-size=4096"]
placeholder = "none"

[[config]]
env = "NPM_CONFIG_REGISTRY"
label = "Package registry"
help = "Where npm downloads packages from."
options = ["https://registry.npmjs.org"]
placeholder = "https://registry.npmjs.org"

[[config]]
env = "NODE_NO_WARNINGS"
label = "No warnings"
help = "Hide process warnings such as deprecation notices."
kind = "switch"
