name = "Elixir"
category = "language"
description = "Elixir with Erlang/OTP 28 and Mix, from the precompiled builds of builds.hex.pm"
icon = "elixir.svg"
icon_color = "#8847B9"
os = ["debian", "ubuntu"]
versions = ["1.20", "1.19", "1.18"]
install_allow = ["@packages", "builds.hex.pm"]
allow = ["hex.pm", "repo.hex.pm", "builds.hex.pm", "github.com", "*.githubusercontent.com"]
install = '''
# Erlang/OTP 28 and Elixir are the precompiled builds the Elixir community uses (built for Ubuntu 24.04).
case "$(uname -m)" in x86_64) otp_dir=ubuntu-24.04 ;; aarch64) otp_dir=arm64/ubuntu-24.04 ;; *) echo "unsupported CPU" >&2; exit 1 ;; esac
sudo apt-get update -q
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
  ca-certificates curl unzip libncurses6 libssl3t64 libstdc++6 git
base=https://builds.hex.pm/builds
otp=$(curl -fsSL "$base/otp/$otp_dir/builds.txt" | cut -d' ' -f1 | grep '^OTP-28\.[0-9.]*$' | sort -V | tail -n1)
[ -n "$otp" ] || { echo "no Erlang/OTP 28 build found" >&2; exit 1; }
# The newest patch release of the chosen minor version built for OTP 28.
ex=$(curl -fsSL "$base/elixir/builds.txt" | cut -d' ' -f1 | grep "^v$BOXQUELL_VERSION\.[0-9]*-otp-28\$" | sort -V | tail -n1)
[ -n "$ex" ] || { echo "no Elixir $BOXQUELL_VERSION build for OTP 28 found" >&2; exit 1; }
cd "$(mktemp -d)"
curl -fsSLo otp.tar.gz "$base/otp/$otp_dir/$otp.tar.gz"
sudo rm -rf /usr/local/erlang
sudo mkdir /usr/local/erlang
sudo tar -xzf otp.tar.gz -C /usr/local/erlang --strip-components=1 --no-same-owner
(cd /usr/local/erlang && sudo ./Install -minimal /usr/local/erlang)
curl -fsSLo elixir.zip "$base/elixir/$ex.zip"
sudo rm -rf /usr/local/elixir
sudo unzip -q elixir.zip -d /usr/local/elixir
for tool in erl erlc escript; do sudo ln -sf "/usr/local/erlang/bin/$tool" /usr/local/bin/; done
for tool in elixir elixirc iex mix; do sudo ln -sf "/usr/local/elixir/bin/$tool" /usr/local/bin/; done
mix local.hex --force
elixir --version | tail -n1
'''

[env]
ELIXIR_ERL_OPTIONS = "+fnu"
